---
# Create namespace
apiVersion: v1
kind: Namespace
metadata:
  name: myns

# manages a group of ports
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dov-deploy
  namespace: myns
  labels:
    app: dov
    name: dov-deploy
spec:
  replicas: 4
  selector:
    matchLabels:
      # must be a subset of labels
      app: myapp
      dept: htx
      commit: asdasd
  template:
    # automatically assumed to be a pod
    metadata:
      name: mypod
      namespace: myns
      labels:
        # any label can work
        # can search
        app: myapp
        dept: htx
        commit: asdasd
    spec:
      containers:
      # an array of containers, names must be unique
      - name: mypod-container
        image: chukmunnlee/dov-bear:v5
        # an alternative is
        # image: chukmunnlee/dov-bear@sha256:.......
        imagePullPolicy: IfNotPresent
        ports:  # container port
          - name: app-port
            containerPort: 3000
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
        env:
          - name: INSTANCE_NAME
            #value: my first pod
            #valueFrom config maps, secrets, fieldref
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: INSTANCE_HASH
            #value: abc123
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['pod-template-hash']

---
apiVersion: v1
kind: Service
metadata:
  name: dov-svc
  namespace: myns
  labels:
    app: dov
    dept: htx
    commit: asded2123
spec:
  # Exists only within the cluster
  type: ClusterIP
  selector:
    # can search
    app: myapp
    dept: htx
    commit: asdasd
  ports:
  - port: 8000  # service port
    targetPort: app-port  # which port from the container

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dov-ing
  namespace: myns
  labels:
    app: dov
    name: dov-ing
spec:
  ingressClassName: nginx
  rules:
  - host: dov.167.172.7.74.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dov-svc
            port:
              number: 8000

---
  # behaviour describes the behaviour for scale up and down
  # stabilization window - how long to wait to observe before scaling because you dont wanna ping pong 5 minutes generally

  # selectPolicy - can have multiple policies
  # 2 pods in 60 seconds
  # 10% in 60s
  # select policy will decide which rule to take. Max/Min - default Max
  # Defaults are pretty good.

  # Scaling down 5-10mins, up 1 min
  # Will overwrite the deployment

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dov-hpa
  namespace: myns
spec:
  minReplicas: 1
  maxReplicas: 8
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dov-deploy
  metrics:
  # external, object, pods are all custom
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 30
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 50